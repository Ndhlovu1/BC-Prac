{% extends "base.html" %}
{% block title %}Clients{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
  <div>
    <h3 class="mb-0 fw-bold">Clients</h3>
    <p class="text-muted mb-0 small">
      Manage your client directory
      &mdash; <span id="totalCount">{{ page_obj.paginator.count }}</span> total
    </p>
  </div>
  <a class="btn btn-ct btn-rounded shadow-1" href="{% url 'client-create' %}">
    <i class="fas fa-plus me-1"></i> New Client
  </a>
</div>

<!-- ============ SEARCH + VIEW TOGGLE ============ -->
<div class="card shadow-1 border-0 rounded-3 mb-4">
  <div class="card-body d-flex flex-column flex-lg-row gap-3 align-items-lg-center justify-content-between">

    <!-- Live search (server-side, debounced AJAX) -->
    <div class="position-relative flex-grow-1" style="max-width:640px;">
      <input type="text"
             id="searchInput"
             class="form-control ps-5 pe-5"
             placeholder="Search by name or code…"
             value="{{ q|default:'' }}"
             autocomplete="off"
             style="border-radius:50rem; height:48px;">
      <span class="position-absolute top-50 translate-middle-y text-muted"
            style="left:1rem;">
        <i class="fas fa-search"></i>
      </span>
      <button type="button"
              id="clearSearchBtn"
              class="btn btn-link position-absolute top-50 translate-middle-y text-muted {% if not q %}d-none{% endif %} p-0"
              style="right:1rem; text-decoration:none;">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- View toggle -->
    <div class="d-flex align-items-center gap-2 bg-light rounded-pill p-1">
      <button id="gridViewBtn"
              type="button"
              class="btn btn-sm btn-rounded"
              title="Grid view"
              style="background:#2c3649; color:#fff;">
        <i class="fas fa-th-large me-1"></i> Grid
      </button>
      <button id="listViewBtn"
              type="button"
              class="btn btn-sm btn-rounded"
              title="List view"
              style="background:#b51c10; color:#fff;">
        <i class="fas fa-list me-1"></i> List
      </button>
    </div>
  </div>

  <!-- Active search chip -->
  <div id="activeFilters" class="px-3 pb-3 {% if not q %}d-none{% endif %}">
    <span class="text-muted small">Active filter:</span>
    <span class="badge rounded-pill bg-light text-dark border ms-1">
      <i class="fas fa-search me-1"></i><span id="activeSearchTerm">{{ q }}</span>
      <button type="button"
              class="btn btn-link p-0 ms-1 text-decoration-none text-danger"
              onclick="clearSearch()">
        <i class="fas fa-times"></i>
      </button>
    </span>
  </div>
</div>

<!-- ============ RESULTS (AJAX target) ============ -->
<div id="resultsWrapper">
  {% include "clientTrackerApp/clients/_client_results.html" %}
</div>

<!-- ============ STYLES ============ -->
<style>
  .logo-thumb {
    max-height: 56px;
    max-width: 120px;
    object-fit: contain;
  }
  .initials-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #b51c10;
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: .5px;
    flex-shrink: 0;
  }
  .code-badge {
    display: inline-block;
    background: #ececec;
    color: #373737;
    font-weight: 600;
    padding: .35em .6em;
    border-radius: .4rem;
    font-size: .78rem;
    letter-spacing: .5px;
    border: 1px solid #dcdcdc;
  }
  .page-link { color: #b51c10; }
  .page-item.active .page-link { background:#b51c10; border-color:#b51c10; color:#fff; }
  .page-item.disabled .page-link { color:#adb5bd !important; background:#f8f9fa; }

  /* Defeat .row / MDB specificity when a view is hidden */
  #gridView.d-none,
  #listView.d-none {
    display: none !important;
  }

  /* Pagination visible only in list mode (JS toggles display) */
  #pagination { display: none; }

  .client-card,
  .client-card-row {
    transition: opacity .2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn .25s ease-out; }

  /* Loading shimmer while AJAX is in flight */
  #resultsWrapper.is-loading { opacity: .55; transition: opacity .15s; pointer-events: none; }
</style>

<!-- ============ SCRIPTS ============ -->
<script>
  // ---------------- View mode ----------------
  let currentViewMode = localStorage.getItem('clientViewMode') || 'grid';

  function setViewMode(mode) {
    currentViewMode = mode;
    try { localStorage.setItem('clientViewMode', mode); } catch (e) { /* ignore */ }

    const gridView = document.getElementById('gridView');
    const listView = document.getElementById('listView');
    const gridBtn  = document.getElementById('gridViewBtn');
    const listBtn  = document.getElementById('listViewBtn');

    // 1) Recolor buttons first — instant visual feedback even if something else fails
    if (gridBtn && listBtn) {
      if (mode === 'grid') {
        gridBtn.style.background = '#2c3649'; gridBtn.style.color = '#fff';
        listBtn.style.background = '#b51c10'; listBtn.style.color = '#fff';
      } else {
        listBtn.style.background = '#b51c10'; listBtn.style.color = '#fff';
        gridBtn.style.background = '#2c3649'; gridBtn.style.color = '#fff';
      }
    }

    // 2) If partial isn't in the DOM, warn LOUDLY
    if (!gridView || !listView) {
      console.warn(
        '[client_list] setViewMode: #gridView or #listView not found. ' +
        'Check include path of _client_results.html.'
      );
      return;
    }

    // 3) Toggle class AND inline display (defeats rogue CSS)
    if (mode === 'grid') {
      gridView.classList.remove('d-none');
      gridView.style.display = '';
      listView.classList.add('d-none');
      listView.style.display = 'none';
    } else {
      gridView.classList.add('d-none');
      gridView.style.display = 'none';
      listView.classList.remove('d-none');
      listView.style.display = '';
    }

    // 4) Pagination only in list mode
    const pagination = document.getElementById('pagination');
    if (pagination) {
      pagination.style.display = (mode === 'list') ? '' : 'none';
    }
  }

  // ---------------- Debounced AJAX search ----------------
  const searchInput  = document.getElementById('searchInput');
  const clearBtn     = document.getElementById('clearSearchBtn');
  const activeBox    = document.getElementById('activeFilters');
  const activeTerm   = document.getElementById('activeSearchTerm');
  const totalCount   = document.getElementById('totalCount');
  const resultsWrap  = document.getElementById('resultsWrapper');
  let   searchTimer;

  function runSearch(q) {
    const url = new URL(window.location.href);
    if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
    url.searchParams.delete('page');

    resultsWrap.classList.add('is-loading');

    fetch(url, { headers: { 'x-requested-with': 'XMLHttpRequest' } })
      .then(r => r.json())
      .then(data => {
        resultsWrap.innerHTML = data.html;
        resultsWrap.classList.remove('is-loading');

        if (typeof data.count === 'number' && totalCount) {
          totalCount.textContent = data.count;
        }

        history.replaceState({}, '', url);

        if (q) {
          activeTerm.textContent = q;
          activeBox.classList.remove('d-none');
          clearBtn.classList.remove('d-none');
        } else {
          activeBox.classList.add('d-none');
          clearBtn.classList.add('d-none');
        }

        setViewMode(currentViewMode);
        bindPaginationAjax();
      })
      .catch(() => resultsWrap.classList.remove('is-loading'));
  }

  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(this.value.trim()), 275);
  });

  function clearSearch() {
    searchInput.value = '';
    searchInput.focus();
    runSearch('');
  }
  clearBtn.addEventListener('click', clearSearch);

  // ---------------- Pagination also goes through AJAX ----------------
  function bindPaginationAjax() {
    document.querySelectorAll('#pagination .page-link').forEach(link => {
      if (link.tagName !== 'A') return;
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        const url  = new URL(href, window.location.origin);

        resultsWrap.classList.add('is-loading');

        fetch(url, { headers: { 'x-requested-with': 'XMLHttpRequest' } })
          .then(r => r.json())
          .then(data => {
            resultsWrap.innerHTML = data.html;
            resultsWrap.classList.remove('is-loading');
            history.replaceState({}, '', url);
            setViewMode(currentViewMode);
            bindPaginationAjax();
          })
          .catch(() => resultsWrap.classList.remove('is-loading'));
      });
    });
  }

  // ---------------- Init ----------------
  document.addEventListener('DOMContentLoaded', function () {
    setViewMode(currentViewMode);
    bindPaginationAjax();

    // 👇 WIRE THE TOGGLE BUTTONS — this is what was missing
    document.getElementById('gridViewBtn').addEventListener('click', () => setViewMode('grid'));
    document.getElementById('listViewBtn').addEventListener('click', () => setViewMode('list'));

    // Keyboard shortcuts
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape') {
        clearSearch();
      }
    });
  });
</script>
{% endblock %}

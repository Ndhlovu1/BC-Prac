{% extends "base.html" %}
{% block title %}Delete Contact{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-1 rounded-3" style="border:1px solid #b51c10;">
      <div class="card-header text-white rounded-top-3" style="background:#b51c10;">
        <h5 class="mb-0 fw-bold">
          <i class="fas fa-triangle-exclamation me-2"></i> Delete Contact
        </h5>
      </div>
      <div class="card-body">
        <p>
          Are you sure you want to delete
          <strong>{{ contact.first_name }} {{ contact.surname }}</strong>
          ({{ contact.email }})?
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-end gap-2">
            <a class="btn btn-outline-secondary btn-rounded"
               href="{% url 'client-detail' contact.client.pk %}">Cancel</a>
            <button class="btn btn-ct btn-rounded shadow-1" type="submit">
              <i class="fas fa-trash me-1"></i> Yes, Delete
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

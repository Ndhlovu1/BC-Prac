{% load static %}
<footer class="mt-auto"
    style="
        background:#fff;
        box-shadow:0 2px 6px rgba(255, 0, 0, 0.43);
        margin: 20px;
        border-radius: 10px;
        ">
  <div class="container">
    <div class="row align-items-center g-3">
      <div class="col-md-6 d-flex align-items-center gap-2">
        <img src="{% static 'img/logo.png' %}" alt="Client Tracker"
             style="height:120px; width:320px; object-fit:cover; border-radius:4px; background:#fff;">
        
      </div>
      <div class="col-md-6 text-md-end small">
        &copy; {% now "Y" %} Client Tracker. All rights reserved.
      </div>
    </div>
  </div>
</footer>

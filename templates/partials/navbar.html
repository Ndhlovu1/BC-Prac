{% load static %}

{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark"
    style="
        background: #b51c10;
        box-shadow: 0 2px 8px rgba(240, 27, 12, 0.5);
        margin: 20px;
        border-radius: 10px;
        padding: 10px 15px;
    ">

    <div class="container-fluid">

        <!-- Brand / Logo -->
        <a class="navbar-brand d-flex align-items-center gap-2"
           href="{% url 'client-list' %}">

            <img src="{% static 'img/logo.png' %}"
                 alt="Client Tracker Logo"
                 class="navbar-logo"
                 style="
                    width: 190px;
                    height: 65px;
                    object-fit: contain;
                    object-position: left center;
                    background: #fff;
                    border-radius: 6px;
                    padding: 4px;
                    display: block;
                 ">

            <span style="font-size:28px;">|</span>

            <span class="fw-bold text-white d-none d-md-inline">
                Client Tracker
            </span>
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button"
                data-mdb-toggle="collapse"
                data-mdb-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <i class="fas fa-bars"></i>
        </button>

        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="mainNav">

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 mt-3 mt-lg-0">

                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm btn-rounded"
                       href="{% url 'client-list' %}">
                        <i class="fas fa-home me-1"></i>
                        Client Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm btn-rounded"
                       href="{% url 'contact-create' %}">
                        <i class="fas fa-user-plus me-1"></i>
                        Create Contact
                    </a>
                </li>

                <li class="nav-item d-none d-lg-block">
                    <span class="text-white opacity-50 px-1">|</span>
                </li>

                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm btn-rounded"
                       href="{% url 'delinked-contacts' %}">
                        <i class="fas fa-link-slash me-1"></i>
                        Delinked
                    </a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm btn-rounded"
                       href="{% url 'admin:index' %}">
                        <i class="fas fa-building me-1"></i>
                        Manage Organization
                    </a>
                </li>

                <li class="nav-item d-none d-lg-block">
                    <span class="text-white opacity-50 px-1">|</span>
                </li>

                <li class="nav-item">
                    <form method="post" action="{% url 'staff-logout' %}" class="d-inline">
                        {% csrf_token %}

                        <button type="submit"
                                class="btn btn-outline-light btn-sm btn-rounded">
                            <i class="fas fa-right-from-bracket me-1"></i>
                            Sign Out
                        </button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>

<style>
    .navbar-logo {
        transition: transform 0.2s ease;
    }

    .navbar-logo:hover {
        transform: scale(1.03);
    }

    @media (max-width: 991px) {
        .navbar-logo {
            width: 155px !important;
            height: 55px !important;
        }

        .navbar-nav {
            align-items: stretch !important;
        }

        .navbar-nav .nav-item {
            margin-bottom: 8px;
        }

        .navbar-nav .btn {
            width: 100%;
            text-align: left;
        }
    }
</style>

{% endif %}
